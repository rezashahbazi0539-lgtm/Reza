services:
  web:
    image: node:22-slim
    restart: on-failure
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
      - db_data:/app/prisma/data
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/data/citynail.db
      - JWT_SECRET=${JWT_SECRET:-citynail-dev-secret-2024}
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: ["sh", "-ec", "apt-get update -qq && apt-get install -y -qq openssl > /dev/null 2>&1 && npm install --legacy-peer-deps && npx prisma generate && npx prisma db push --skip-generate && node prisma/seed.js && exec npm run dev"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  db_data:
